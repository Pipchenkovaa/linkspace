  :root {
    --canvas: #E4E4E4;
    --panel: #F2F2F2;
    --ink: #151515;
    --soft: #6B6B6B;
    --muted: #9C9C9C;
    --line: rgba(0, 0, 0, .07);
    --star: #F2B705;
    --online: #2FBF5B;
    --danger: #D9443A;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.3, .9, .3, 1.15);
    /* стекло: полупрозрачный белый + размытие того, что под ним + светлый кант */
    --glass-bg: rgba(255, 255, 255, .58);
    --glass-blur: blur(18px) saturate(1.6);
    --glass-rim: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 0 0 1px rgba(255, 255, 255, .6);
    --lift: 0 1px 2px rgba(0, 0, 0, .04), 0 14px 32px -16px rgba(0, 0, 0, .2);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--panel); color: var(--ink); font: 15px/1.45 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 2px solid #3F6FE0; outline-offset: 3px; }
  .glass { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); box-shadow: var(--glass-rim), var(--lift); }

  .shell { max-width: 1520px; margin: 0 auto; padding: 16px 48px 64px; }

  /* шапка: прилипает к верху и при прокрутке размывает карточки под собой */
  .top { position: sticky; top: 12px; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 18px; border-radius: 28px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .logo i { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(180deg, #333, #121212); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 14px -6px rgba(0,0,0,.6); }
  .status { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px; font-weight: 500; color: var(--soft); margin-left: 6px; }
  .status b { width: 8px; height: 8px; border-radius: 50%; background: var(--online); box-shadow: 0 0 0 3px rgba(47,191,91,.18); transition: background .3s, box-shadow .3s; }
  .status.down b { background: var(--danger); box-shadow: 0 0 0 3px rgba(217,68,58,.18); }
  .status.down { color: var(--danger); }
  .spacer { flex: 1; }
  .search { width: 340px; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; border-radius: 999px; background: rgba(255,255,255,.72); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); transition: background .2s, box-shadow .2s; }
  .search:focus-within { background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14), 0 0 0 4px rgba(0,0,0,.04); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--ink); }
  .search input::placeholder { color: var(--muted); }
  .search kbd { font: 500 11px "Geist"; color: var(--muted); border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; }
  .btn-dark { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; color: #fff; font-weight: 500; font-size: 14px; white-space: nowrap;
    background: linear-gradient(180deg, #303030, #131313); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(0,0,0,.5), 0 10px 20px -10px rgba(0,0,0,.6); transition: transform .15s, filter .2s; }
  .btn-dark:hover { filter: brightness(1.25); }
  .btn-dark:active { transform: scale(.98); }
  .btn-dark:disabled { opacity: .3; cursor: not-allowed; filter: none; transform: none; }
  .btn-dark.danger { background: linear-gradient(180deg, #E5574D, #C3352C); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 10px 20px -10px rgba(195,53,44,.7); }
  .btn-ghost { height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 500; font-size: 14px; color: var(--soft); transition: background .2s, color .2s; }
  .btn-ghost:hover { background: rgba(0,0,0,.05); color: var(--ink); }

  /* заголовок: серая строка — где я, чёрная — что вижу */
  .hero { margin: 58px 0 36px; }
  h1 { margin: 0; font-size: 58px; line-height: 1.04; letter-spacing: -0.04em; font-weight: 600; }
  h1 .pre { display: block; color: #A8A8A8; font: inherit; letter-spacing: inherit; text-align: left; }
  h1 button.pre { cursor: pointer; transition: color .2s; }
  h1 button.pre:hover { color: var(--ink); }
  h1 button.pre::before { content: "← "; }
  h1 .cnt { color: #A8A8A8; }

  /* полка коллекций: прокручивается вбок, сколько бы их ни было */
  .row-title { display: flex; align-items: center; gap: 8px; }
  .row-title h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .row-title h2 span { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .row-title .new { margin-left: auto; white-space: nowrap; height: 36px; padding: 0 14px; border-radius: 999px; color: var(--soft); font-size: 14px; font-weight: 500; transition: background .2s, color .2s; }
  .row-title .new:hover { background: rgba(0,0,0,.05); color: var(--ink); }
  .arrow { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); transition: opacity .2s; }
  .arrow:disabled { opacity: .3; cursor: default; }
  .shelf { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 48px; scroll-behavior: smooth; margin: 0 -48px 8px; padding: 20px 48px 34px; scrollbar-width: none; }
  .shelf::-webkit-scrollbar { display: none; }
  .shelf.fade-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 90px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 90px), transparent); }
  .shelf.fade-l { -webkit-mask-image: linear-gradient(90deg, transparent, #000 90px); mask-image: linear-gradient(90deg, transparent, #000 90px); }
  .shelf.fade-l.fade-r { -webkit-mask-image: linear-gradient(90deg, transparent, #000 90px, #000 calc(100% - 90px), transparent); mask-image: linear-gradient(90deg, transparent, #000 90px, #000 calc(100% - 90px), transparent); }

  /* папка = задняя стенка + листы-ссылки + стеклянная передняя стенка; --a — цвет коллекции */
  .folder { --a: #2F8F80; position: relative; flex: 0 0 248px; height: 236px; scroll-snap-align: start; cursor: pointer; border-radius: 24px; }
  .folder .back { position: absolute; left: 0; right: 0; bottom: 0; height: 176px;
    clip-path: path("M0 46 Q0 22 24 22 H104 Q116 22 124 14 L132 6 Q138 0 150 0 H224 Q248 0 248 24 V152 Q248 176 224 176 H24 Q0 176 0 152 Z");
    background: linear-gradient(165deg, color-mix(in oklab, var(--a) 24%, #f0f0f0), color-mix(in oklab, var(--a) 42%, #c8c8c8)); }
  .folder .shade { position: absolute; left: 12px; right: 12px; bottom: 0; height: 60px; border-radius: 24px; box-shadow: 0 20px 28px -14px color-mix(in oklab, var(--a) 50%, #000); opacity: .45; }
  .sheet { position: absolute; bottom: 60px; width: 112px; height: 140px; border-radius: 16px; border: 4px solid rgba(255,255,255,.9); box-shadow: 0 10px 22px -10px rgba(0,0,0,.4);
    display: grid; align-content: start; font-weight: 600; letter-spacing: -0.02em; color: #fff; transition: transform .5s var(--spring); }
  .sheet.s1 { left: 12px; transform: rotate(-9deg); background: color-mix(in oklab, var(--a) 70%, #000); justify-items: start; padding: 10px 12px; font-size: 16px; }
  .sheet.s2 { left: 68px; bottom: 66px; z-index: 1; background: var(--a); justify-items: center; padding-top: 18px; font-size: 26px; }
  .sheet.s3 { right: 12px; transform: rotate(9deg); background: color-mix(in oklab, var(--a) 32%, #fff); color: color-mix(in oklab, var(--a) 75%, #000); justify-items: end; padding: 10px 12px; font-size: 16px; }
  .sheet.blank { background: rgba(255,255,255,.75); border-style: dashed; border-color: color-mix(in oklab, var(--a) 40%, #fff); box-shadow: none; }
  .folder:hover .s1, .folder.on .s1 { transform: translate(-6px, -8px) rotate(-14deg); }
  .folder:hover .s2, .folder.on .s2 { transform: translateY(-12px); }
  .folder:hover .s3, .folder.on .s3 { transform: translate(6px, -8px) rotate(14deg); }
  .front { position: absolute; left: 0; right: 0; bottom: 0; height: 124px; z-index: 2; padding: 15px 16px 14px 18px; display: flex; flex-direction: column;
    clip-path: path("M0 24 Q0 0 24 0 H96 Q106 0 114 8 L124 18 Q130 26 142 26 H224 Q248 26 248 50 V100 Q248 124 224 124 H24 Q0 124 0 100 Z");
    background: linear-gradient(180deg, color-mix(in oklab, var(--a) 7%, rgb(255 255 255 / .58)), color-mix(in oklab, var(--a) 4%, rgb(255 255 255 / .5)));
    backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6); transition: background .35s var(--ease), color .35s; }
  .front .rim { position: absolute; inset: 0; width: 248px; height: 124px; pointer-events: none; fill: none; stroke: url(#rim); stroke-width: 2.5; }
  .front .cnt { font-size: 12.5px; color: color-mix(in oklab, var(--a) 70%, #333); font-weight: 500; }
  .front .name { margin-top: 12px; font-weight: 600; font-size: 17px; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .front .bottom { margin-top: auto; display: flex; align-items: center; gap: 10px; }
  .front .recent { flex: 1; min-width: 0; font-size: 12px; color: #6f6f6f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { flex: none; width: 40px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: rgba(255,255,255,.6); box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(0,0,0,.06), 0 4px 10px -6px rgba(0,0,0,.3); transition: background .2s; }
  .more:hover { background: #fff; }
  /* выбранная папка темнеет — так видно, какая коллекция сейчас открыта */
  .folder.on .front { background: linear-gradient(180deg, rgb(30 30 32 / .8), rgb(14 14 16 / .9)); color: #fff; }
  .folder.on .front .rim { stroke-opacity: .25; }
  .folder.on .front .cnt { color: color-mix(in oklab, var(--a) 55%, #fff); }
  .folder.on .front .recent { color: rgba(255,255,255,.55); }
  .folder.on .more { background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); color: #fff; }
  .folder.on .more:hover { background: rgba(255,255,255,.22); }
  .draft-input { margin-top: 8px; width: 100%; height: 40px; border: 0; outline: 0; border-radius: 12px; padding: 0 12px; background: rgba(255,255,255,.85); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); font-size: 15px; font-weight: 500; }
  .draft-input:focus { box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 0 0 4px rgba(255,255,255,.6); }
  .draft-hint { margin-top: auto; font-size: 11.5px; color: #777; }
  .draft-hint.err { color: var(--danger); font-weight: 500; }

  /* фильтры */
  .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .seg { position: relative; display: inline-flex; padding: 4px; border-radius: 999px; }
  .seg button { position: relative; z-index: 1; height: 34px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; color: var(--soft); transition: color .25s; }
  .seg button.on { color: var(--ink); }
  .seg button svg { color: var(--star); }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 6px 14px -8px rgba(0,0,0,.3); transition: transform .4s var(--spring), width .4s var(--spring); }
  .divider { width: 1px; height: 22px; background: rgba(0,0,0,.1); margin: 0 6px; }
  .chips { display: contents; }
  .chip { height: 34px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; color: var(--soft); background: rgba(255,255,255,.66); box-shadow: inset 0 0 0 1px var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background .2s, color .2s; }
  .chip span { color: var(--muted); font-weight: 400; margin-left: 5px; }
  .chip:hover { background: #fff; color: var(--ink); }
  .chip.on { background: var(--ink); color: #fff; box-shadow: none; }
  .chip.on span { color: #9C9C9C; }
  .chip.more-tags { color: var(--ink); }
  .result { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--soft); }
  .result button { color: var(--ink); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(0,0,0,.25); }

  /* карточки ссылок */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 18px; }
  .card { --a: #2F8F80; position: relative; min-width: 0; display: flex; flex-direction: column; padding: 18px 20px 16px; border-radius: 24px;
    background: rgba(255,255,255,.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(255,255,255,.7), var(--lift); }
  .card.flash { animation: flash 1s ease 3; }
  @keyframes flash { 50% { box-shadow: 0 0 0 4px color-mix(in oklab, var(--a) 50%, transparent), var(--lift); } }
  .card .head { display: flex; align-items: center; gap: 12px; }
  .tile { position: relative; flex: none; width: 44px; height: 44px; }
  .tile i { position: absolute; left: 6px; right: 6px; top: 0; height: 34px; border-radius: 9px; border: 2px solid rgba(255,255,255,.95); transform: rotate(-8deg);
    background: linear-gradient(165deg, color-mix(in oklab, var(--a) 70%, #fff), var(--a) 55%, color-mix(in oklab, var(--a) 80%, #000)); box-shadow: 0 4px 8px -4px rgba(0,0,0,.35); }
  .tile b { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; display: grid; place-items: center; border-radius: 11px; font-weight: 600; font-size: 14px; color: color-mix(in oklab, var(--a) 85%, #000);
    background: linear-gradient(180deg, color-mix(in oklab, var(--a) 12%, rgb(255 255 255 / .42)), rgb(255 255 255 / .3));
    backdrop-filter: blur(4px) saturate(1.8); -webkit-backdrop-filter: blur(4px) saturate(1.8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 6px 12px -8px color-mix(in oklab, var(--a) 60%, #000); }
  .who { min-width: 0; }
  .who a, .who b { display: block; font-weight: 600; font-size: 15.5px; letter-spacing: -0.01em; color: inherit; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; } /* вся карточка — ссылка */
  .who span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts { margin-left: auto; display: flex; gap: 6px; position: relative; z-index: 1; }
  .icon-btn { flex: none; width: 34px; height: 34px; overflow: hidden; border-radius: 50%; display: grid; place-items: center; color: #B3B3B3; background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line); transition: opacity .2s, width .2s var(--ease), margin .2s var(--ease), color .2s, background .2s; }
  .icon-btn:hover { color: var(--ink); background: #fff; }
  .icon-btn.hover-only { width: 0; margin-left: -6px; opacity: 0; }
  .card:hover .hover-only, .card:focus-within .hover-only { width: 34px; margin-left: 0; opacity: 1; }
  .icon-btn.star.on { color: var(--star); background: #FFF8E1; box-shadow: inset 0 0 0 1px #FBE7A6; }
  .icon-btn.star:active svg { transform: scale(1.3); }
  .icon-btn svg { transition: transform .3s var(--spring); }
  .card p { margin: 12px 0 0; color: var(--soft); font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; position: relative; z-index: 1; padding-top: 14px; }
  .tag { display: inline-flex; align-items: center; height: 26px; font-size: 12px; font-weight: 500; color: var(--soft); background: rgba(0,0,0,.045); border-radius: 999px; padding: 0 10px; }
  button.tag:hover { background: rgba(0,0,0,.09); color: var(--ink); }
  button.tag.on { background: var(--ink); color: #fff; }
  .coll { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .coll i { width: 7px; height: 7px; border-radius: 50%; background: var(--a); }
  .confirm { display: flex; align-items: center; gap: 6px; width: 100%; font-size: 13.5px; font-weight: 500; }
  .confirm span { margin-right: auto; }
  .confirm button { height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--soft); }
  .confirm button:hover { background: rgba(0,0,0,.05); color: var(--ink); }
  .confirm button.yes { background: var(--danger); color: #fff; }

  /* пустые состояния и ошибки */
  .empty { grid-column: 1 / -1; display: grid; justify-items: center; text-align: center; padding: 56px 24px 60px; border-radius: 28px; }
  .empty .pic { width: 92px; height: 72px; margin-bottom: 18px; }
  .empty b { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .empty p { margin: 6px 0 20px; max-width: 440px; color: var(--soft); }
  .empty code { font: 500 12.5px ui-monospace, Menlo, monospace; background: rgba(0,0,0,.05); padding: 3px 8px; border-radius: 8px; color: var(--ink); }

  /* меню папки */
  .menu { position: fixed; z-index: 40; min-width: 200px; padding: 6px; border-radius: 18px; background: rgba(255,255,255,.82); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: var(--glass-rim), 0 22px 44px -16px rgba(0,0,0,.32); animation: pop .22s var(--spring); }
  .menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 500; text-align: left; }
  .menu button:hover { background: rgba(0,0,0,.05); }
  .menu .danger { color: var(--danger); }

  /* модальные окна: стекло поверх размытой страницы */
  .overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(228,228,228,.4); backdrop-filter: blur(10px) saturate(1.1); -webkit-backdrop-filter: blur(10px) saturate(1.1); }
  .overlay.top { z-index: 60; background: rgba(228,228,228,.2); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .overlay.enter { animation: fade .2s ease; }
  .overlay.enter .dialog { animation: pop .32s var(--spring); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  .dialog { width: min(540px, 100%); max-height: calc(100vh - 48px); overflow: auto; border-radius: 30px; padding: 26px 28px 24px; background: rgba(255,255,255,.84); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
    box-shadow: var(--glass-rim), 0 44px 90px -30px rgba(0,0,0,.4); }
  .dialog.small { width: min(440px, 100%); }
  .d-head { display: flex; align-items: center; justify-content: space-between; }
  .dialog h3 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .dialog .sub { margin: 8px 0 0; color: var(--soft); font-size: 14.5px; }
  .x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--soft); }
  .x:hover { background: rgba(0,0,0,.05); color: var(--ink); }
  .field { margin-top: 16px; }
  .field > label, .field > .label { display: block; font-size: 13px; font-weight: 500; color: var(--soft); margin-bottom: 7px; }
  .field i.req { color: var(--danger); font-style: normal; }
  .input { width: 100%; border: 0; outline: 0; border-radius: 14px; padding: 12px 14px; font-size: 14.5px; background: rgba(0,0,0,.04); box-shadow: inset 0 0 0 1px transparent; transition: background .2s, box-shadow .2s; }
  .input:focus, .input:focus-within { background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14), 0 0 0 4px rgba(0,0,0,.04); }
  .input.bad { box-shadow: inset 0 0 0 1px rgba(217,68,58,.6); }
  .input[readonly] { color: var(--soft); background: rgba(0,0,0,.025); }
  textarea.input { resize: none; height: 72px; display: block; }
  .err { color: var(--danger); font-size: 12.5px; margin-top: 6px; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { height: 34px; padding: 0 13px 0 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; color: var(--soft); background: rgba(0,0,0,.045); transition: background .2s, color .2s; }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--a); }
  .pill:hover { background: rgba(0,0,0,.08); color: var(--ink); }
  .pill.on { background: var(--ink); color: #fff; }
  .pill em { font-style: normal; font-size: 11px; opacity: .6; }
  .pill.add { background: transparent; border: 1px dashed rgba(0,0,0,.22); padding: 0 13px; }
  .pill.add:hover { border-color: rgba(0,0,0,.4); background: rgba(255,255,255,.6); }
  .pill-input { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 4px 0 11px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.16), 0 0 0 4px rgba(0,0,0,.04); }
  .pill-input i { width: 9px; height: 9px; border-radius: 50%; background: var(--a); }
  .pill-input input { width: 180px; border: 0; outline: 0; background: transparent; font-size: 13.5px; font-weight: 500; }
  .pill-input button { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--ink); }
  .tagbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; min-height: 46px; cursor: text; }
  .tagbox .tag { background: #fff; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); padding-right: 4px; }
  .tagbox .tag button { width: 20px; height: 20px; margin-left: 3px; border-radius: 50%; color: var(--muted); font-size: 15px; line-height: 1; }
  .tagbox .tag button:hover { background: rgba(0,0,0,.06); color: var(--ink); }
  .tagbox input { flex: 1; min-width: 120px; border: 0; outline: 0; background: transparent; padding: 4px; font-size: 14.5px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding: 10px 12px 10px 14px; border-radius: 14px; background: rgba(0,0,0,.03); font-size: 14.5px; font-weight: 500; }
  .switch-row span { display: inline-flex; align-items: center; gap: 8px; }
  .switch-row svg { color: var(--star); }
  .switch { width: 46px; height: 28px; border-radius: 999px; background: rgba(0,0,0,.14); position: relative; transition: background .25s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .35s var(--spring); }
  .switch.on { background: var(--star); }
  .switch.on::after { transform: translateX(18px); }
  .d-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 24px; }
  .dup-icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; margin-bottom: 16px; background: var(--a); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 20px -10px color-mix(in oklab, var(--a) 70%, #000); }
  .mini { --a: #2F8F80; display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px 14px; border-radius: 18px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }

  /* уведомление снизу */
  .toast { position: fixed; left: 50%; bottom: 28px; z-index: 80; max-width: calc(100vw - 40px); padding: 12px 18px; border-radius: 999px; color: #fff; font-size: 14px; font-weight: 500;
    background: rgba(24,24,24,.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 16px 30px -12px rgba(0,0,0,.5);
    transform: translate(-50%, 24px); opacity: 0; transition: transform .4s var(--spring), opacity .25s; pointer-events: none; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  /* переключатель состояний эскиза — в приложении его не будет */
  .demo { position: fixed; left: 28px; bottom: 28px; z-index: 30; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; font-size: 12px; }
  .demo span { padding: 0 8px 0 10px; color: var(--muted); }
  .demo button { height: 28px; padding: 0 11px; border-radius: 999px; font-weight: 500; color: var(--soft); }
  .demo button.on { background: var(--ink); color: #fff; }

  @media (max-width: 1100px) {
    .shell { padding: 12px 20px 48px; }
    .shelf { margin: 0 -20px 8px; padding-left: 20px; padding-right: 20px; scroll-padding: 0 20px; }
    .search { width: 240px; }
    h1 { font-size: 44px; }
  }
  @media (max-width: 760px) {
    .top { flex-wrap: wrap; }
    .search { order: 5; width: 100%; }
    .status, .search kbd, .arrow { display: none; }
    #add { width: 44px; padding: 0; font-size: 0; gap: 0; }
    .result { margin-left: 0; width: 100%; }
    h1 { font-size: 34px; }
    .grid { grid-template-columns: 1fr; }
    .demo { display: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient></defs>
</svg>

<div class="shell">
  <header class="top glass">
    <div class="logo"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg></i>LinkSpace</div>
    <button class="status" id="status" data-action="status" title="GET /health раз в 30 секунд · версия API 1.0.0"><b></b><span>API работает</span></button>
    <div class="spacer"></div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Поиск по ссылкам и тегам" autocomplete="off" aria-label="Поиск">
      <kbd>/</kbd>
    </label>
    <button class="btn-dark" id="add" data-action="add"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить ссылку</button>
  </header>

  <section class="hero"><h1 id="title"></h1></section>

  <section id="shelf-wrap">
    <div class="row-title">
      <h2>Коллекции<span id="col-count"></span></h2>
      <button class="new" data-action="new-col">+ Новая коллекция</button>
      <button class="arrow glass" id="shelf-l" data-action="shelf-l" aria-label="Прокрутить влево"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="arrow glass" id="shelf-r" data-action="shelf-r" aria-label="Прокрутить вправо"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>

  <section class="filters" id="filters">
    <div class="seg glass" id="seg">
      <span class="thumb"></span>
      <button class="on" data-action="fav" data-v="0">Все</button>
      <button data-action="fav" data-v="1"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>Избранное</button>
    </div>
    <span class="divider"></span>
    <div class="chips" id="chips"></div>
    <div class="result" id="result"></div>
  </section>

  <section class="grid" id="grid"></section>
</div>

<div id="modals"></div>
<div id="menu-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="demo glass" id="demo">
  <span>Эскиз:</span>
  <button class="on" data-action="demo" data-s="data">С данными</button>
  <button data-action="demo" data-s="empty">Пусто</button>
  <button data-action="demo" data-s="down">API офлайн</button>
</div>

<script>
/* Эскиз: данные живут в памяти страницы, но правила те же, что в API (docs/mvp.md):
   нормализация URL и тегов, 409 на дубликаты, удаление коллекции с переносом, фильтры через И. */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Цвет коллекции берётся из палитры по id: в API цвета нет, а так он не меняется при переименовании
const PALETTE = ['#2F8F80', '#6A5AD4', '#E07A55', '#3F6FE0', '#D49A2E', '#C75A8A', '#56627A'];
const accent = id => PALETTE[(id - 1) % PALETTE.length];

const ICONS = {
  star: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  starO: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  pencil: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>',
  trash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  dots: '<svg width="16" height="4" viewBox="0 0 16 4" fill="currentColor"><circle cx="2" cy="2" r="1.7"/><circle cx="8" cy="2" r="1.7"/><circle cx="14" cy="2" r="1.7"/></svg>',
  check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  copy: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  rename: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/></svg>',
};
const FRONT_D = 'M0 24 Q0 0 24 0 H96 Q106 0 114 8 L124 18 Q130 26 142 26 H224 Q248 26 248 50 V100 Q248 124 224 124 H24 Q0 124 0 100 Z';

function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}
const nLinks = n => `${n} ${plural(n, 'ссылка', 'ссылки', 'ссылок')}`;
const inCols = n => `в ${n} ${plural(n, 'коллекции', 'коллекциях', 'коллекциях')}`;

/* --- те же правила, что в normalize.py --- */
function parseUrl(raw) {
  try { const u = new URL(String(raw).trim()); return /^https?:$/.test(u.protocol) && u.hostname ? u : null; } catch { return null; }
}
function normUrl(raw) {
  const u = parseUrl(raw);
  if (!u) return null;
  u.hash = '';
  [...u.searchParams.keys()].forEach(k => { if (k.toLowerCase().startsWith('utm_')) u.searchParams.delete(k); });
  return `${u.protocol}//${u.host}${u.pathname.replace(/\/+$/, '')}${u.search}`;
}
const domainOf = raw => parseUrl(raw).hostname.replace(/^www\./, '');
const mark = d => (d.match(/^\d{1,2}/) || [d[0].toUpperCase()])[0];
// Адрес для карточки: без https:// и www., без слеша в конце
const shortUrl = raw => raw.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/+$/, '');
const tileHTML = domain => `<span class="tile" aria-hidden="true"><i></i><b>${esc(mark(domain))}</b></span>`;

/* --- данные эскиза --- */
const SEED_COLS = ['Development', 'Design', 'AI', 'Учёба', 'Чтение', 'Рецепты'];
const SEED_LINKS = [
  [1, 'https://react.dev/learn', 'React Learn', 'Официальный учебник: компоненты, состояние, хуки и мышление в React.', ['react', 'docs'], true],
  [1, 'https://fastapi.tiangolo.com/tutorial/', 'FastAPI Tutorial', 'Пошаговое руководство: маршруты, модели Pydantic, зависимости и тесты.', ['python', 'backend', 'docs'], true],
  [2, 'https://21st.dev', 'UI components', 'Каталог готовых React-компонентов с исходниками для быстрых прототипов.', ['design', 'ui'], true],
  [3, 'https://huggingface.co/learn/cookbook/advanced_rag', 'RAG from scratch', 'Как собрать поиск по документам с эмбеддингами и языковой моделью.', ['ai', 'rag'], false],
  [2, 'https://mobbin.com', 'Mobile patterns', 'Скриншоты реальных приложений, разложенные по сценариям и экранам.', ['design', 'references'], false],
  [4, 'https://stepik.org/course/2461', 'Линейная алгебра', 'Курс с задачами: матрицы, определители, собственные векторы.', ['math', 'курс'], false],
  [1, 'https://effector.dev', 'Effector', 'Стейт-менеджер: события, сторы и эффекты вместо разрозненных useState.', ['react', 'state'], false],
  [3, 'https://www.promptingguide.ai', 'Prompting Guide', 'Техники промптинга: few-shot, chain-of-thought, агенты.', ['ai', 'prompts'], true],
  [5, 'https://www.joshwcomeau.com/css/', 'Josh Comeau: CSS', 'Интерактивные объяснения flexbox, grid и анимаций.', ['css', 'articles'], true],
  [2, 'https://www.figma.com/community', 'Figma Community', 'Бесплатные UI-киты, плагины и шаблоны.', ['design', 'ui'], false],
  [6, 'https://www.seriouseats.com', 'Serious Eats', 'Рецепты с объяснением, почему они работают.', ['food'], false],
  [3, 'https://python.langchain.com/docs/introduction/', 'LangChain Docs', 'Цепочки, агенты и интеграции с векторными базами.', ['ai', 'python', 'docs'], false],
  [4, 'https://www.coursera.org/learn/econometrics', 'Эконометрика, лекции', 'Регрессии, проверка гипотез и работа с данными.', ['math', 'курс'], false],
  [5, 'https://habr.com/ru/articles/', 'Хабр: статьи', null, ['articles'], false],
  [1, 'https://nextjs.org/docs/app', 'Next.js App Router', 'Маршрутизация, серверные компоненты и загрузка данных.', ['react', 'docs'], false],
];

const S = {
  cols: [], links: [], nextCol: 1, nextLink: 1,
  f: { col: null, fav: false, tag: null, q: '' },
  api: 'ok', tagsOpen: false,
  draft: null,      // { mode: 'new' | 'rename', id, value, error } — ввод названия прямо в папке
  confirmDel: null, // id ссылки, у которой открыт вопрос «Удалить?»
  menu: null,       // { id, x, y }
  modal: null,      // { type: 'link' | 'delcol', ... }
  dup: null,        // поп-ап «Такая ссылка уже есть»
};

function seed() {
  S.cols = SEED_COLS.map((name, i) => ({ id: i + 1, name }));
  S.nextCol = S.cols.length + 1;
  S.links = SEED_LINKS.map(([col, url, title, description, tags, favorite], i) => ({ id: i + 1, col, url, domain: domainOf(url), norm: normUrl(url), title, description, tags, favorite }));
  S.nextLink = S.links.length + 1;
}

const colById = id => S.cols.find(c => c.id === id);
const linkById = id => S.links.find(l => l.id === id);
const countIn = id => S.links.filter(l => l.col === id).length;
const anyFilter = () => S.f.fav || S.f.tag || S.f.q;

// Фильтры складываются через И, как GET /links?collection_id=&favorite=&tag=&search=
function matches(l, skipTag = false) {
  const f = S.f;
  if (f.col != null && l.col !== f.col) return false;
  if (f.fav && !l.favorite) return false;
  if (!skipTag && f.tag && !l.tags.includes(f.tag)) return false;
  if (f.q && ![l.title, l.description || '', l.url, ...l.tags].some(x => x.toLowerCase().includes(f.q))) return false;
  return true;
}

/* --- отрисовка --- */
function renderStatus() {
  const down = S.api === 'down';
  $('#status').classList.toggle('down', down);
  $('#status span').textContent = down ? 'API недоступен' : 'API работает';
  $('#add').disabled = down;
}

function renderHero() {
  const t = $('#title');
  const c = colById(S.f.col);
  if (S.api === 'down') t.innerHTML = `<span class="pre">Ваша библиотека</span>Нет связи с сервером`;
  else if (!S.cols.length) t.innerHTML = `<span class="pre">Ваша библиотека</span>Пока пусто`;
  else if (c) t.innerHTML = `<button class="pre" data-action="reset-col" title="Показать все коллекции">Ваша библиотека</button>${esc(c.name)}<span class="cnt"> · ${nLinks(countIn(c.id))}</span>`;
  else t.innerHTML = `<span class="pre">Ваша библиотека</span>${nLinks(S.links.length)} ${inCols(S.cols.length)}`;
}

function sheetHTML(cls, l) { return `<div class="sheet ${cls}">${esc(mark(l.domain))}</div>`; }

function folderHTML(c, draft) {
  const items = S.links.filter(l => l.col === c.id).sort((a, b) => b.id - a.id);
  const [newest, second, third] = items;
  const sheets = items.length
    ? [second && sheetHTML('s1', second), sheetHTML('s2', newest), third && sheetHTML('s3', third)].join('')
    : '<div class="sheet s2 blank"></div>';
  const on = S.f.col === c.id && !draft;
  const front = draft
    ? `<span class="cnt">${draft.mode === 'new' ? 'Новая коллекция' : 'Переименовать'}</span>
       <input class="draft-input" data-action="noop" maxlength="40" placeholder="Название" value="${esc(draft.value)}" aria-label="Название коллекции">
       <span class="draft-hint ${draft.error ? 'err' : ''}">${esc(draft.error || 'Enter — сохранить, Esc — отмена')}</span>`
    : `<span class="cnt">${nLinks(items.length)}</span>
       <b class="name" title="${esc(c.name)}">${esc(c.name)}</b>
       <div class="bottom"><span class="recent">${items.length ? items.slice(0, 2).map(l => esc(l.title)).join(' · ') : 'Пока пусто'}</span>
       <button class="more" data-action="col-menu" data-id="${c.id}" aria-label="Действия с коллекцией ${esc(c.name)}">${ICONS.dots}</button></div>`;
  return `<article class="folder ${on ? 'on' : ''} ${draft ? 'drafting' : ''}" style="--a:${accent(c.id)}" ${draft ? '' : `data-action="col" data-id="${c.id}" tabindex="0" role="button" aria-pressed="${on}"`}>
    <div class="back"></div><div class="shade"></div>${sheets}
    <div class="front"><svg class="rim" viewBox="0 0 248 124"><path d="${FRONT_D}"/></svg>${front}</div>
  </article>`;
}

function renderShelf() {
  const wrap = $('#shelf-wrap'), shelf = $('#shelf');
  wrap.hidden = S.api === 'down';
  $('#col-count').textContent = S.cols.length || '';
  const keep = shelf.scrollLeft;
  let html = S.cols.map(c => folderHTML(c, S.draft?.mode === 'rename' && S.draft.id === c.id ? S.draft : null)).join('');
  if (S.draft?.mode === 'new') html += folderHTML({ id: S.nextCol, name: '' }, S.draft);
  shelf.innerHTML = html;
  shelf.hidden = !html;
  shelf.style.scrollBehavior = 'auto';
  shelf.scrollLeft = keep;
  shelf.style.scrollBehavior = '';
  updateShelfEdges();
}

function updateShelfEdges() {
  const s = $('#shelf');
  const left = s.scrollLeft > 4, right = s.scrollLeft + s.clientWidth < s.scrollWidth - 4;
  s.classList.toggle('fade-l', left);
  s.classList.toggle('fade-r', right);
  $('#shelf-l').disabled = !left;
  $('#shelf-r').disabled = !right;
  $('#shelf-l').hidden = $('#shelf-r').hidden = !left && !right;
}

function renderFilters() {
  const box = $('#filters');
  box.hidden = S.api === 'down' || !S.cols.length;
  if (box.hidden) return;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === S.f.fav));
  moveThumb();

  // Счётчики тегов — по ссылкам, которые видны с текущими фильтрами (кроме самого тега)
  const counts = {};
  S.links.filter(l => matches(l, true)).forEach(l => l.tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  if (S.f.tag && !counts[S.f.tag]) counts[S.f.tag] = 0;
  const tags = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const LIMIT = 8;
  let shown = S.tagsOpen ? tags : tags.slice(0, LIMIT);
  if (S.f.tag && !shown.some(([t]) => t === S.f.tag)) shown = [...shown, [S.f.tag, counts[S.f.tag]]];
  const hidden = tags.length - shown.length;
  $('#chips').innerHTML = shown.map(([t, n]) => `<button class="chip ${S.f.tag === t ? 'on' : ''}" data-action="tag" data-t="${esc(t)}">${esc(t)}<span>${n}</span></button>`).join('')
    + (hidden > 0 ? `<button class="chip more-tags" data-action="tags-more">Ещё ${hidden}</button>` : '')
    + (S.tagsOpen && tags.length > LIMIT ? `<button class="chip more-tags" data-action="tags-more">Свернуть</button>` : '');

  const base = S.links.filter(l => S.f.col == null || l.col === S.f.col).length;
  const found = S.links.filter(l => matches(l)).length;
  $('#result').innerHTML = anyFilter()
    ? `Найдено ${found} из ${base}<button data-action="reset">Сбросить</button>`
    : `${nLinks(base)} · сначала новые`;
}

function moveThumb() {
  const on = $('#seg button.on'), t = $('#seg .thumb');
  t.style.width = on.offsetWidth + 'px';
  t.style.transform = `translateX(${on.offsetLeft}px)`;
}

const FOLDER_PIC = `<svg class="pic" viewBox="0 0 92 72" fill="none"><path d="M6 20a8 8 0 0 1 8-8h18l6 6h40a8 8 0 0 1 8 8v32a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8V20z" fill="rgba(0,0,0,.05)" stroke="rgba(0,0,0,.14)" stroke-width="1.5"/><path d="M6 30a8 8 0 0 1 8-8h64a8 8 0 0 1 8 8v28a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8V30z" fill="rgba(255,255,255,.8)" stroke="rgba(0,0,0,.14)" stroke-width="1.5"/></svg>`;
const OFF_PIC = `<svg class="pic" viewBox="0 0 92 72" fill="none" stroke="rgba(217,68,58,.75)" stroke-width="2.2" stroke-linecap="round"><path d="M28 50h36a12 12 0 0 0 1-24 18 18 0 0 0-34-4 14 14 0 0 0-3 28z" fill="rgba(217,68,58,.06)"/><path d="M20 14l52 46"/></svg>`;

function emptyHTML(pic, title, text, btn) {
  return `<div class="empty glass">${pic}<b>${title}</b><p>${text}</p>${btn || ''}</div>`;
}

function renderList() {
  const g = $('#grid');
  if (S.api === 'down') {
    g.innerHTML = emptyHTML(OFF_PIC, 'Сервер не отвечает', 'Не удалось загрузить библиотеку. Проверьте, что API запущен: <code>uvicorn app_final:app --env-file .env</code>', '<button class="btn-dark" data-action="retry">Повторить</button>');
    return;
  }
  if (!S.cols.length) {
    g.innerHTML = emptyHTML(FOLDER_PIC, 'У вас пока нет коллекций', 'Создайте первую или сразу добавьте ссылку: новую коллекцию можно завести прямо в форме.', '<button class="btn-dark" data-action="new-col">Создать коллекцию</button>');
    return;
  }
  const list = S.links.filter(l => matches(l)).sort((a, b) => b.id - a.id);
  if (list.length) { g.innerHTML = list.map(cardHTML).join(''); return; }

  const scope = S.links.filter(l => S.f.col == null || l.col === S.f.col);
  const addBtn = '<button class="btn-dark" data-action="add">Добавить ссылку</button>';
  if (!scope.length && S.f.col != null) g.innerHTML = emptyHTML(FOLDER_PIC, 'В этой коллекции пока ничего нет', 'Добавьте ссылку, коллекция в форме уже будет выбрана.', addBtn);
  else if (!scope.length) g.innerHTML = emptyHTML(FOLDER_PIC, 'Здесь пока нет ссылок', 'Сохраните первый полезный ресурс.', addBtn);
  else if (S.f.fav && !S.f.tag && !S.f.q) g.innerHTML = emptyHTML(FOLDER_PIC, 'В избранном пусто', 'Отмечайте важные ссылки звёздочкой, чтобы быстро находить их здесь.');
  else g.innerHTML = emptyHTML(FOLDER_PIC, 'Ничего не найдено', 'Измените запрос или сбросьте фильтры.', '<button class="btn-dark" data-action="reset">Сбросить фильтры</button>');
}

function cardHTML(l) {
  const c = colById(l.col);
  const foot = S.confirmDel === l.id
    ? `<div class="confirm"><span>Удалить ссылку?</span><button data-action="del-cancel">Отмена</button><button class="yes" data-action="del-ok" data-id="${l.id}">Удалить</button></div>`
    : l.tags.map(t => `<button class="tag ${S.f.tag === t ? 'on' : ''}" data-action="tag" data-t="${esc(t)}">${esc(t)}</button>`).join('')
      + (S.f.col == null ? `<span class="coll"><i></i>${esc(c.name)}</span>` : '');
  return `<article class="card" style="--a:${accent(l.col)}" data-link-id="${l.id}">
    <div class="head">
      ${tileHTML(l.domain)}
      <div class="who"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title)}</a><span title="${esc(l.url)}">${esc(shortUrl(l.url))}</span></div>
      <div class="acts">
        <button class="icon-btn hover-only" data-action="edit" data-id="${l.id}" title="Изменить" aria-label="Изменить">${ICONS.pencil}</button>
        <button class="icon-btn hover-only" data-action="del-link" data-id="${l.id}" title="Удалить" aria-label="Удалить">${ICONS.trash}</button>
        <button class="icon-btn star ${l.favorite ? 'on' : ''}" data-action="star" data-id="${l.id}" title="${l.favorite ? 'Убрать из избранного' : 'В избранное'}" aria-pressed="${l.favorite}">${l.favorite ? ICONS.star : ICONS.starO}</button>
      </div>
    </div>
    ${l.description ? `<p>${esc(l.description)}</p>` : ''}
    <div class="foot">${foot}</div>
  </article>`;
}

function render() { renderStatus(); renderHero(); renderShelf(); renderFilters(); renderList(); }

/* --- меню папки --- */
function renderMenu() {
  const root = $('#menu-root');
  if (!S.menu) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="menu" style="left:${S.menu.x}px;top:${S.menu.y}px" role="menu">
    <button data-action="rename" data-id="${S.menu.id}" role="menuitem">${ICONS.rename}Переименовать</button>
    <button class="danger" data-action="delcol" data-id="${S.menu.id}" role="menuitem">${ICONS.trash}Удалить коллекцию</button>
  </div>`;
}

/* --- модальные окна --- */
function linkDialog(m) {
  const f = m.form, e = m.errors, edit = m.id != null;
  const err = k => e[k] ? `<div class="err">${esc(e[k])}</div>` : '';
  const note = k => m.notes[k] ? `<div class="hint">${esc(m.notes[k])}</div>` : '';
  const pending = accent(S.nextCol); // такой цвет получит новая коллекция
  const newPill = f.newColEditing
    ? `<span class="pill-input" style="--a:${pending}"><i></i><input id="f-newcol" data-field="newColDraft" maxlength="40" placeholder="Название коллекции" value="${esc(f.newColDraft)}" autocomplete="off"><button data-action="m-newcol-ok" aria-label="Готово">${ICONS.check}</button></span>`
    : f.newCol
      ? `<button class="pill on" style="--a:${pending}" data-action="m-newcol" title="Изменить название"><i></i>${esc(f.newCol)}<em>новая</em></button>`
      : '<button class="pill add" data-action="m-newcol">+ Новая коллекция</button>';
  return `<div class="overlay ${m.enter ? 'enter' : ''}" data-action="m-close">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" data-action="noop">
      <div class="d-head"><h3 id="dlg-title">${edit ? 'Изменить ссылку' : 'Новая ссылка'}</h3><button class="x" data-action="m-close" aria-label="Закрыть">${ICONS.x}</button></div>
      <div class="field"><label for="f-url">Адрес <i class="req">*</i></label>
        <input id="f-url" class="input ${e.url ? 'bad' : ''}" data-field="url" value="${esc(f.url)}" placeholder="https://" autocomplete="off" ${edit ? 'readonly' : ''}>
        ${e.url ? err('url') : edit ? '<div class="hint">Адрес не меняется. Чтобы сохранить другой, добавьте новую ссылку.</div>' : ''}</div>
      <div class="field"><label for="f-title">Название <i class="req">*</i></label>
        <input id="f-title" class="input ${e.title ? 'bad' : ''}" data-field="title" maxlength="120" value="${esc(f.title)}" placeholder="Например, React Learn" autocomplete="off">${err('title')}</div>
      <div class="field"><label for="f-desc">Описание</label>
        <textarea id="f-desc" class="input" data-field="description" maxlength="500" placeholder="Чем полезна ссылка">${esc(f.description)}</textarea></div>
      <div class="field"><span class="label">Коллекция <i class="req">*</i></span>
        <div class="pills">${S.cols.map(c => `<button class="pill ${f.col === c.id ? 'on' : ''}" style="--a:${accent(c.id)}" data-action="m-col" data-id="${c.id}"><i></i>${esc(c.name)}</button>`).join('')}${newPill}</div>${err('col') || note('col')}</div>
      <div class="field"><label for="f-tag">Теги</label>
        <div class="input tagbox ${e.tags ? 'bad' : ''}" data-action="focus-tag">${f.tags.map(t => `<span class="tag">${esc(t)}<button data-action="m-untag" data-t="${esc(t)}" aria-label="Убрать тег ${esc(t)}">×</button></span>`).join('')}
          <input id="f-tag" data-field="tagDraft" value="${esc(f.tagDraft)}" placeholder="${f.tags.length ? '' : 'react, docs'}" autocomplete="off"></div>
        ${e.tags ? err('tags') : '<div class="hint">Enter или запятая — добавить тег. Регистр не важен: React и react — один тег.</div>'}</div>
      <div class="switch-row"><span>${ICONS.star}В избранное</span><button class="switch ${f.fav ? 'on' : ''}" role="switch" aria-checked="${f.fav}" aria-label="В избранное" data-action="m-fav"></button></div>
      <div class="d-foot"><button class="btn-ghost" data-action="m-close">Отмена</button><button class="btn-dark" data-action="m-save">${edit ? 'Сохранить' : 'Добавить'}</button></div>
    </div></div>`;
}

function delColDialog(m) {
  const c = colById(m.id), n = countIn(c.id), others = S.cols.filter(x => x.id !== c.id);
  const body = n === 0
    ? `<h3>Удалить коллекцию «${esc(c.name)}»?</h3><p class="sub">Это действие нельзя отменить.</p>
       <div class="d-foot"><button class="btn-ghost" data-action="m-close">Отмена</button><button class="btn-dark danger" data-action="dc-ok">Удалить</button></div>`
    : `<h3>Удалить «${esc(c.name)}»?</h3><p class="sub">В коллекции ${nLinks(n)}. Выберите, куда их перенести перед удалением.</p>
       <div class="field"><span class="label">Перенести в</span>
       ${others.length ? `<div class="pills">${others.map(o => `<button class="pill ${m.target === o.id ? 'on' : ''}" style="--a:${accent(o.id)}" data-action="dc-target" data-id="${o.id}"><i></i>${esc(o.name)}</button>`).join('')}</div>`
         : '<div class="hint">Других коллекций нет. Сначала создайте ещё одну, чтобы было куда перенести ссылки.</div>'}</div>
       <div class="d-foot"><button class="btn-ghost" data-action="m-close">Отмена</button><button class="btn-dark danger" data-action="dc-ok" ${m.target ? '' : 'disabled'}>Перенести и удалить</button></div>`;
  return `<div class="overlay ${m.enter ? 'enter' : ''}" data-action="m-close"><div class="dialog small" role="dialog" aria-modal="true" data-action="noop">${body}</div></div>`;
}

function dupDialog(d) {
  const e = linkById(d.existing), from = colById(e.col), to = colById(d.target), same = e.col === d.target;
  return `<div class="overlay top enter" data-action="dup-close"><div class="dialog small" role="alertdialog" aria-modal="true" data-action="noop">
    <div class="dup-icon" style="--a:${accent(e.col)}">${ICONS.copy}</div>
    <h3>Такая ссылка уже есть</h3>
    <p class="sub">Эта ссылка уже сохранена в коллекции «${esc(from.name)}».${same ? '' : ` Можно оставить её там или перенести в «${esc(to.name)}». То, что вы ввели в форме, не сохранится.`}</p>
    <div class="mini" style="--a:${accent(e.col)}">${tileHTML(e.domain)}<div class="who"><b>${esc(e.title)}</b><span>${esc(shortUrl(e.url))}</span></div></div>
    <div class="d-foot">${same
      ? '<button class="btn-ghost" data-action="dup-close">Закрыть</button><button class="btn-dark" data-action="dup-show">Показать ссылку</button>'
      : `<button class="btn-ghost" data-action="dup-keep">Оставить там</button><button class="btn-dark" data-action="dup-move">Перенести в «${esc(to.name)}»</button>`}</div>
  </div></div>`;
}

function renderModals() {
  let html = '';
  if (S.modal?.type === 'link') html += linkDialog(S.modal);
  if (S.modal?.type === 'delcol') html += delColDialog(S.modal);
  if (S.dup) html += dupDialog(S.dup);
  $('#modals').innerHTML = html;
  if (S.modal) S.modal.enter = false;
}

function openLinkModal(id = null) {
  const l = id != null ? linkById(id) : null;
  S.menu = null; renderMenu();
  const newCol = { newCol: null, newColDraft: '', newColEditing: !S.cols.length };
  S.modal = { type: 'link', id, enter: true, errors: {}, notes: {}, createdCol: null,
    form: l ? { url: l.url, title: l.title, description: l.description || '', col: l.col, tags: [...l.tags], tagDraft: '', fav: l.favorite, ...newCol }
            : { url: '', title: '', description: '', col: S.f.col, tags: [], tagDraft: '', fav: false, ...newCol } };
  renderModals();
  $(l ? '#f-title' : '#f-url').focus();
}

// Если коллекцию создали из формы, а ссылка так и не сохранилась, пустую коллекцию удаляем
function closeModal() {
  const created = S.modal?.createdCol;
  S.modal = null; S.dup = null;
  renderModals();
  if (created && !countIn(created)) {
    S.cols = S.cols.filter(c => c.id !== created);
    if (S.f.col === created) S.f.col = null;
    render();
  }
}

// Название новой коллекции из формы. Совпало с существующей — просто выбираем её (иначе был бы 409)
function commitNewCol(redraw = true) {
  const m = S.modal, f = m.form, name = f.newColDraft.trim();
  f.newColEditing = false;
  delete m.notes.col;
  if (name) {
    const taken = S.cols.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (taken) { f.col = taken.id; f.newCol = null; m.notes.col = `Коллекция «${taken.name}» уже есть, выбрали её`; }
    else { f.newCol = name; f.col = null; }
    delete m.errors.col;
  }
  if (redraw) renderModals();
}

// Тег: обрезать пробелы, нижний регистр, 1–30 символов, без повторов (normalize_tags)
function addTags(raw) {
  const f = S.modal.form;
  for (const part of raw.split(',')) {
    const t = part.trim().toLowerCase();
    if (!t) continue;
    if (t.length > 30) { S.modal.errors.tags = 'Тег — до 30 символов'; return false; }
    if (!f.tags.includes(t)) f.tags.push(t);
  }
  f.tagDraft = '';
  delete S.modal.errors.tags;
  return true;
}

function saveLink() {
  const m = S.modal, f = m.form, e = {};
  if (f.newColEditing) commitNewCol(false);
  if (f.tagDraft.trim()) addTags(f.tagDraft);
  if (m.id == null && !parseUrl(f.url)) e.url = f.url.trim() ? 'Адрес должен начинаться с http:// или https:// и содержать домен' : 'Введите адрес';
  if (!f.title.trim()) e.title = 'Введите название';
  if (f.col == null && !f.newCol) e.col = 'Выберите коллекцию или создайте новую';
  if (m.errors.tags) e.tags = m.errors.tags;
  m.errors = e;
  if (Object.keys(e).length) { renderModals(); return; }

  if (f.newCol) {                                       // сначала POST /collections, потом ссылка с её id
    const id = S.nextCol++;
    S.cols.push({ id, name: f.newCol });
    Object.assign(m, { createdCol: id });
    Object.assign(f, { col: id, newCol: null });
  }
  const where = `${m.createdCol === f.col ? 'в новую коллекцию' : 'в'} «${colById(f.col).name}»`;

  if (m.id != null) {                                   // PATCH /links/{id}
    const l = linkById(m.id), moved = l.col !== f.col;
    Object.assign(l, { title: f.title.trim(), description: f.description.trim() || null, col: f.col, tags: f.tags, favorite: f.fav });
    closeModal(); render();
    toast(moved ? `Ссылка перенесена ${where}` : 'Изменения сохранены');
    return;
  }
  const norm = normUrl(f.url);                          // POST /links → 409, если такой адрес уже есть
  const existing = S.links.find(l => l.norm === norm);
  if (existing) { S.dup = { existing: existing.id, target: f.col }; renderModals(); return; }
  const url = f.url.trim();
  const l = { id: S.nextLink++, col: f.col, url, domain: domainOf(url), norm, title: f.title.trim(), description: f.description.trim() || null, tags: f.tags, favorite: f.fav };
  S.links.push(l);
  closeModal(); render();
  toast(`Ссылка добавлена ${where}`);
  flash(l.id);
}

function flash(id) {
  const el = document.querySelector(`[data-link-id="${id}"]`);
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 3200);
}

/* --- коллекции: создание и переименование прямо в папке --- */
function startDraft(draft) {
  S.menu = null; renderMenu();
  S.draft = draft;
  renderShelf();
  const input = $('.folder.drafting .draft-input');
  if (draft.mode === 'new') $('#shelf').scrollTo({ left: $('#shelf').scrollWidth });
  else $('.folder.drafting').scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
  input.focus({ preventScroll: true });
  input.select();
}

function commitDraft() {
  const d = S.draft, name = d.value.trim();
  const taken = S.cols.find(c => c.name.toLowerCase() === name.toLowerCase() && c.id !== d.id); // 409
  const error = !name ? 'Введите название' : taken ? `Коллекция «${taken.name}» уже есть` : '';
  if (error) {
    d.error = error;
    const hint = $('.folder.drafting .draft-hint');
    hint.textContent = error; hint.classList.add('err');
    return;
  }
  if (d.mode === 'new') {
    const id = S.nextCol++;
    S.cols.push({ id, name });
    toast(`Коллекция «${name}» создана`);
    S.draft = null;
    render();
    $('#shelf').scrollTo({ left: $('#shelf').scrollWidth });
    return;
  } else {
    colById(d.id).name = name;
    toast('Коллекция переименована');
  }
  S.draft = null;
  render();
}

function deleteCollection() {
  const m = S.modal, c = colById(m.id), n = countIn(c.id), to = colById(m.target);
  S.links.forEach(l => { if (l.col === c.id) l.col = m.target; });  // DELETE /collections/{id}?move_to=
  S.cols = S.cols.filter(x => x.id !== c.id);
  if (S.f.col === c.id) S.f.col = n ? m.target : null;
  closeModal(); render();
  toast(n ? `«${c.name}» удалена, ${nLinks(n)} ${plural(n, 'перенесена', 'перенесены', 'перенесены')} в «${to.name}»` : `Коллекция «${c.name}» удалена`);
}

/* --- уведомление --- */
let toastTimer;
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// Папки не перерисовываются, а только меняют класс: так видна анимация листов и затемнения
function selectFolder() {
  S.confirmDel = null;
  document.querySelectorAll('.folder[data-id]').forEach(el => {
    const on = Number(el.dataset.id) === S.f.col;
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', on);
  });
  renderStatus(); renderHero(); renderFilters(); renderList();
}

/* --- обработка кликов: одна функция на всю страницу --- */
const ACTIONS = {
  col: id => { S.f.col = S.f.col === id ? null : id; selectFolder(); },
  'reset-col': () => { S.f.col = null; selectFolder(); },
  fav: (_, el) => { S.f.fav = el.dataset.v === '1'; renderFilters(); renderList(); },
  tag: (_, el) => { S.f.tag = S.f.tag === el.dataset.t ? null : el.dataset.t; renderFilters(); renderList(); },
  'tags-more': () => { S.tagsOpen = !S.tagsOpen; renderFilters(); },
  reset: () => { S.f = { ...S.f, fav: false, tag: null, q: '' }; $('#q').value = ''; renderFilters(); renderList(); },
  star: id => {
    const l = linkById(id); l.favorite = !l.favorite;          // PATCH /links/{id} {"favorite": …}
    renderFilters(); renderList();
    toast(l.favorite ? 'Добавлено в избранное' : 'Убрано из избранного');
  },
  edit: id => openLinkModal(id),
  'del-link': id => { S.confirmDel = id; renderList(); },
  'del-cancel': () => { S.confirmDel = null; renderList(); },
  'del-ok': id => { S.links = S.links.filter(l => l.id !== id); S.confirmDel = null; render(); toast('Ссылка удалена'); },
  add: () => openLinkModal(),
  'new-col': () => startDraft({ mode: 'new', value: '', error: '' }),
  'col-menu': (id, el) => {
    if (S.menu?.id === id) { S.menu = null; renderMenu(); return; }
    const r = el.getBoundingClientRect();
    S.menu = { id, x: Math.min(r.right - 200, innerWidth - 216), y: r.bottom + 8 };
    renderMenu();
  },
  rename: id => startDraft({ mode: 'rename', id, value: colById(id).name, error: '' }),
  delcol: id => { S.menu = null; renderMenu(); S.modal = { type: 'delcol', id, target: null, enter: true }; renderModals(); },
  'dc-target': id => { S.modal.target = id; renderModals(); },
  'dc-ok': () => deleteCollection(),
  'shelf-l': () => $('#shelf').scrollBy({ left: -532 }),
  'shelf-r': () => $('#shelf').scrollBy({ left: 532 }),
  'm-close': () => closeModal(),
  'm-save': () => saveLink(),
  'm-col': id => { Object.assign(S.modal.form, { col: id, newCol: null, newColEditing: false }); delete S.modal.errors.col; delete S.modal.notes.col; renderModals(); },
  'm-newcol': () => { const f = S.modal.form; delete S.modal.notes.col; f.newColEditing = true; f.newColDraft = f.newCol || ''; renderModals(); $('#f-newcol').focus(); },
  'm-newcol-ok': () => commitNewCol(),
  'm-fav': () => { S.modal.form.fav = !S.modal.form.fav; const sw = $('.switch'); sw.classList.toggle('on'); sw.setAttribute('aria-checked', S.modal.form.fav); },
  'm-untag': (_, el) => { const f = S.modal.form; f.tags = f.tags.filter(t => t !== el.dataset.t); renderModals(); $('#f-tag').focus(); },
  'focus-tag': () => $('#f-tag').focus(),
  'dup-close': () => { S.dup = null; renderModals(); },
  'dup-keep': () => closeModal(),
  'dup-show': () => { const id = S.dup.existing; closeModal(); S.f = { col: linkById(id).col, fav: false, tag: null, q: '' }; $('#q').value = ''; render(); flash(id); },
  'dup-move': () => {                                            // PATCH /links/{existing_link_id} {"collection_id": …}
    const l = linkById(S.dup.existing), to = colById(S.dup.target);
    l.col = to.id;
    closeModal(); render(); toast(`Ссылка перенесена в «${to.name}»`); flash(l.id);
  },
  status: () => setDemo(S.api === 'down' ? 'data-keep' : 'down'),
  retry: () => setDemo('data-keep'),
  demo: (_, el) => setDemo(el.dataset.s),
  noop: () => {},
};

function setDemo(mode) {
  S.menu = null; S.draft = null; S.confirmDel = null; closeModal(); renderMenu();
  if (mode === 'down') S.api = 'down';
  else {
    S.api = 'ok';
    if (mode === 'data') { seed(); S.f = { col: null, fav: false, tag: null, q: '' }; $('#q').value = ''; }
    if (mode === 'empty') { S.cols = []; S.links = []; S.nextCol = 1; S.nextLink = 1; S.f = { col: null, fav: false, tag: null, q: '' }; $('#q').value = ''; }
  }
  const active = mode === 'data-keep' ? (S.cols.length ? 'data' : 'empty') : mode;
  document.querySelectorAll('#demo button').forEach(b => b.classList.toggle('on', b.dataset.s === active));
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  // клик мимо открытого меню или черновика папки закрывает их
  if (S.menu && !e.target.closest('.menu') && el?.dataset.action !== 'col-menu') { S.menu = null; renderMenu(); if (el?.dataset.action === 'col') return; }
  if (S.draft && !e.target.closest('.folder.drafting') && !['new-col', 'rename'].includes(el?.dataset.action)) { S.draft = null; renderShelf(); if (el?.dataset.action === 'col') return; }
  if (!el) return;
  if (el.dataset.action === 'm-close' && el.classList.contains('overlay') && e.target !== el) return;
  if (el.dataset.action === 'dup-close' && el.classList.contains('overlay') && e.target !== el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el.dataset.id ? Number(el.dataset.id) : null, el); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.f.q = t.value.trim().toLowerCase(); S.confirmDel = null; renderFilters(); renderList(); return; }
  if (t.classList.contains('draft-input')) {
    S.draft.value = t.value;
    if (S.draft.error) { S.draft.error = ''; const h = $('.folder.drafting .draft-hint'); h.textContent = 'Enter — сохранить, Esc — отмена'; h.classList.remove('err'); }
    return;
  }
  if (t.dataset.field && S.modal) {
    if (t.dataset.field === 'tagDraft' && t.value.includes(',')) {
      const parts = t.value.split(','), rest = parts.pop();
      if (addTags(parts.join(','))) S.modal.form.tagDraft = rest;
      renderModals(); $('#f-tag').focus(); return;
    }
    S.modal.form[t.dataset.field] = t.value;
    if (S.modal.errors[t.dataset.field]) { delete S.modal.errors[t.dataset.field]; t.classList.remove('bad'); t.closest('.field').querySelector('.err')?.remove(); }
  }
});

document.addEventListener('keydown', e => {
  const t = e.target, typing = t.matches('input, textarea');
  if (t.classList.contains('draft-input')) {
    if (e.key === 'Enter') { e.preventDefault(); commitDraft(); }
    if (e.key === 'Escape') { S.draft = null; renderShelf(); }
    return;
  }
  if (t.id === 'f-newcol') {
    if (e.key === 'Enter') { e.preventDefault(); commitNewCol(); return; }
    if (e.key === 'Escape') { e.preventDefault(); S.modal.form.newColEditing = false; renderModals(); return; }
  }
  if (t.id === 'f-tag') {
    if (e.key === 'Enter' && t.value.trim()) { e.preventDefault(); addTags(t.value); renderModals(); $('#f-tag').focus(); return; }
    if (e.key === 'Backspace' && !t.value && S.modal.form.tags.length) { S.modal.form.tags.pop(); renderModals(); $('#f-tag').focus(); return; }
  }
  if (e.key === 'Enter' && S.modal?.type === 'link' && t.matches('#f-url, #f-title, #f-tag') && !S.dup) { e.preventDefault(); saveLink(); return; }
  if (e.key === 'Escape') {
    if (S.dup) { S.dup = null; renderModals(); }
    else if (S.modal) closeModal();
    else if (S.menu) { S.menu = null; renderMenu(); }
    else if (t.id === 'q' && t.value) { t.value = ''; S.f.q = ''; renderFilters(); renderList(); }
    return;
  }
  if (e.key === '/' && !typing && !S.modal) { e.preventDefault(); $('#q').focus(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches('.folder[data-action="col"]')) { e.preventDefault(); ACTIONS.col(Number(t.dataset.id)); }
});

const closeMenu = () => { if (S.menu) { S.menu = null; renderMenu(); } };
$('#shelf').addEventListener('scroll', () => { updateShelfEdges(); closeMenu(); }, { passive: true });
addEventListener('scroll', closeMenu, { passive: true });
addEventListener('resize', () => { updateShelfEdges(); if (!$('#filters').hidden) moveThumb(); S.menu = null; renderMenu(); });

seed();
render();
document.fonts.ready.then(() => { if (!$('#filters').hidden) moveThumb(); });
</script>
</body>
</html>
