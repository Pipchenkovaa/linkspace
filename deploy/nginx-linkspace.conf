server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Вход по логину и паролю: в приложении нет своей авторизации
    auth_basic "LinkSpace";
    auth_basic_user_file /etc/nginx/linkspace.htpasswd;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Проверка работоспособности открыта без пароля
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/health;
    }

    # API: /api/links -> http://127.0.0.1:8000/links
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
    }

    # Интерфейс
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
